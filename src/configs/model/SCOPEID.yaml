# SCOPEID: ID-only ablation of SCOPE (github.com/dangkh/scope). Defaults follow the SCOPE repo:
# effective lr 0.003 (src/main.py there), knn_k 10, n_mm_layers 1, preference reg 0.003 (hard-coded), batch 2048.
# ID only: no feature file is loaded, except text_feature_file when scope_item_graph = text (kNN item-item graph).
embedding_size: 64
feat_embed_dim: 64
is_multimodal_model: False
train_batch_size: 2048
learning_rate: 0.003
knn_k: 10
n_mm_layers: 1
low_high_ratio: 0.05        # scripts/scopeid.pbs passes 0.03 / 0.05 / 0.10 (SCOPE: 0.10)
scope_branches: lf          # lf (low + full) | ff (two full-graph branches) | f | l
scope_gate: id              # id (gate without the semantic conflict c_u) | none (alpha = 1)
scope_item_graph: none      # none | text (text kNN item-item graph on the concatenated item representation)
hyper_parameters: ["scope_branches", "scope_gate", "scope_item_graph", "low_high_ratio"]
