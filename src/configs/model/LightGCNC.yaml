embedding_size: 64
is_multimodal_model: True
item_input: id          # id | text | visual | tv
proj_hidden: 256
proj_layers: 2
feat_dropout: 0.0
n_layers: [1, 2, 3]
reg_weight: [1e-02, 1e-03, 1e-04, 1e-05]
hyper_parameters: ["n_layers", "reg_weight"]
user_weight: softmax    # two-channel only: softmax | free | none
layer_mode: all        # all | to (items: even layers) | pure (items even, users odd layers)
item_graph: none        # none | text | visual | tv  (DRAGON-style item-item kNN graph)
knn_k: 10
n_mm_layers: 1
mm_image_weight: 0.1
